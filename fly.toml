# Fly.io deployment.
#
#   fly launch --no-deploy
#   fly postgres create --name flagforge-db
#   fly postgres attach flagforge-db          # sets DATABASE_URL
#   fly secrets set JWT_SECRET="$(openssl rand -base64 48)"
#   fly deploy

# App names are unique across the whole of Fly, not just your account. This one
# is taken — by this deployment — so a fork has to change it here before
# `fly deploy`. Nothing else refers to it.
app = "flagforge"

# Fly retired several regions, `mad` among them; `fly platform regions` is the
# list that is actually accepted, and `cdg` is what is left nearest Madrid.
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

# Migrations and demo data, before any new machine takes traffic.
#
# The runtime image is distroless — no shell — so there is no `fly ssh console`
# to seed by hand; it has to happen here. `--if-empty` is what makes that safe
# to run on every deploy rather than only the first.
# Arguments only, no binary path: Fly appends this to the image's ENTRYPOINT,
# so naming the binary here makes it `/app/flagforge /app/flagforge seed`, and
# the first argument is parsed as a subcommand. That fails the whole deploy.
[deploy]
  release_command = "seed --if-empty"

[env]
  APP_ENV = "production"
  PORT = "8080"
  RUST_LOG = "flagforge=info,flagforge_api=info,flagforge_storage=info,warn"
  # Fly's Postgres connection limit is shared across machines, so keep each
  # machine's pool modest rather than letting two machines exhaust it.
  DATABASE_MAX_CONNECTIONS = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero, because this deployment is a demo: the visitor is a person opening a
  # link, not an SDK evaluating in a hot loop, and `suspend` resumes from a
  # memory snapshot rather than booting cold. A real production deployment
  # should raise this to 1 — there, keeping a machine warm is worth it precisely
  # because an evaluation is supposed to take milliseconds.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Readiness, not liveness: this one may legitimately fail while the database
# is down, and Fly should stop routing rather than restart the machine.
[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "3s"
  path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
