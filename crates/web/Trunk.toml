[build]
target = "index.html"
dist = "dist"
# Relative asset URLs, so the SPA works whether it is served from the binary at
# `/` or opened from a subdirectory during development.
public_url = "/"

# Trunk empties `dist` on every build, which deletes the tracked `.gitkeep`
# that lets a fresh clone compile without the WASM toolchain — `rust-embed`
# needs the directory to exist. Putting it back here rather than trusting
# whoever runs the build to notice: this has broken CI twice.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "touch $TRUNK_STAGING_DIR/.gitkeep"]

[watch]
watch = ["src", "index.html", "styles"]

[serve]
port = 8081
# Everything the app does not recognise is proxied to the API, so `trunk serve`
# behaves like the production single-origin deployment and there is no CORS
# difference between dev and prod.
[[proxy]]
backend = "http://127.0.0.1:8080/api"

[[proxy]]
backend = "http://127.0.0.1:8080/health"
