[package]
name = "flagforge-sdk"
description = "Rust client for FlagForge: fetches a snapshot once and evaluates flags locally."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The evaluation engine itself. The SDK does not reimplement targeting — it
# runs the same code the server runs, which is the only way local and remote
# decisions can be guaranteed to agree.
flagforge-core = { workspace = true }

tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
flagforge-api = { path = "../api" }
flagforge-storage = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
axum = { workspace = true }
tracing-subscriber = { workspace = true }
