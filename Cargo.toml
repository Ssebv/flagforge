[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/api"]
# `crates/web` is a WASM-only Leptos app with its own workspace; see its
# Cargo.toml for why it is not a member here.
exclude = ["crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/your-user/flagforge"
authors = ["FlagForge contributors"]

[workspace.dependencies]
flagforge-core = { path = "crates/core" }
flagforge-storage = { path = "crates/storage" }

# Async runtime & HTTP
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.7", features = ["trace", "cors", "request-id", "timeout", "limit", "compression-gzip", "catch-panic"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Persistence
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

# Domain primitives
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
semver = "1.0"
regex = "1.13"

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Security
# `rust_crypto` rather than `aws_lc_rs`: a pure-Rust backend keeps the
# container build free of a C toolchain and cross-compiles without surprises.
# `use_pem` is off because we only ever sign with an HMAC secret.
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"

# Docs
utoipa = { version = "5.5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# Misc
rust-embed = "8.12"
arc-swap = "1.9"
dashmap = "6.2"
validator = { version = "0.21", features = ["derive"] }
dotenvy = "0.15"

# Dev
proptest = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Not `panic = "abort"`: the server catches panics per request so one bad
# handler cannot take the whole process down with it.

[profile.dev.package.sqlx-macros]
opt-level = 3
