name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on a warning rather than letting them accumulate until
  # nobody reads the output any more.
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    # Queries are checked against the committed .sqlx cache, so no database is
    # needed to lint.
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flagforge
          POSTGRES_PASSWORD: flagforge
          POSTGRES_DB: flagforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagforge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://flagforge:flagforge@localhost:5432/flagforge

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked

      - name: Apply migrations
        run: sqlx migrate run --source migrations

      - name: Verify the committed query cache matches the schema
        # Catches the classic failure: someone edits a query and forgets to
        # re-run `cargo sqlx prepare`, so CI passes here but the Docker build
        # (which has no database) breaks.
        run: cargo sqlx prepare --workspace --check -- --all-targets

      - name: Test
        run: cargo test --workspace --all-features

  dashboard:
    name: Dashboard (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `targets:` or `components:` here on purpose. rust-toolchain.toml
      # pins the channel and overrides whatever this step installs, so anything
      # named here would be added to a toolchain that never gets used. The pin
      # file declares them instead.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/web

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Check formatting
        working-directory: crates/web
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: crates/web
        run: cargo clippy --all-targets

      - name: Build the bundle
        working-directory: crates/web
        run: trunk build --release

      - name: Report bundle size
        working-directory: crates/web
        run: |
          # The whole payload crosses the wire on first load, so a regression
          # here is a user-visible one.
          echo "### Dashboard bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist | awk '{print $5, $9}' >> "$GITHUB_STEP_SUMMARY"
          gzip -c dist/*_bg.wasm | wc -c \
            | awk '{printf "wasm gzipped: %.2f MB\n", $1/1048576}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Quick start
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # Exactly the two commands the README opens with, on a machine that has
      # never run them. This job exists because they were broken on `main` and
      # nothing noticed: the Docker job builds the image and wires it to a
      # Postgres by hand, which never touches docker-compose.yml — so a volume
      # mounted where Postgres 18 refuses to start shipped, and sat there.
      - name: docker compose up
        run: |
          docker compose up --build -d
          for i in $(seq 1 45); do
            curl -sf http://localhost:8080/health/ready && break
            sleep 2
          done
          curl -sf http://localhost:8080/health/ready || {
            echo "::error::the quick start in the README does not work"
            docker compose ps
            docker compose logs
            exit 1
          }

      - name: docker compose exec api /app/flagforge seed
        run: docker compose exec -T api /app/flagforge seed

      # The dashboard is embedded in the binary, and the seeded read-only
      # account is what the README tells a reader to sign in with. Both are
      # claims the quick start makes, so both get checked.
      - name: The dashboard serves and the seeded account works
        run: |
          curl -sf http://localhost:8080/ | grep -q "<title>" \
            || { echo "::error::no dashboard at /"; exit 1; }

          token=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"viewer@acme.test","password":"read-only-demo-account"}' \
            | jq -r .token)
          [ -n "$token" ] && [ "$token" != null ] \
            || { echo "::error::the published demo account cannot sign in"; exit 1; }

          flags=$(curl -sf http://localhost:8080/api/v1/projects/checkout/environments/production/flags \
            -H "authorization: Bearer $token" | jq length)
          [ "$flags" -ge 5 ] \
            || { echo "::error::the seed produced $flags flags"; exit 1; }

      # The tour is the second thing a reader does, and it is prose: the
      # integration suite proves the *API* works, but nothing proves the
      # commands printed in the README still match it. A renamed field would
      # leave every test green and the documentation wrong.
      - name: The five-minute tour still runs
        run: |
          set -euo pipefail
          BASE=http://localhost:8080

          TOKEN=$(curl -sf -X POST $BASE/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"organization_name":"Tour Inc","email":"tour@acme.test","password":"correct-horse-battery-staple"}' \
            | jq -r .token)
          AUTH="authorization: Bearer $TOKEN"

          curl -sf -X POST $BASE/api/v1/projects -H "$AUTH" -H 'content-type: application/json' \
            -d '{"key":"checkout","name":"Checkout"}' > /dev/null
          curl -sf -X POST $BASE/api/v1/projects/checkout/environments -H "$AUTH" -H 'content-type: application/json' \
            -d '{"key":"production","name":"Production","is_production":true}' > /dev/null
          curl -sf -X POST $BASE/api/v1/projects/checkout/flags -H "$AUTH" -H 'content-type: application/json' \
            -d '{"key":"checkout.v2","name":"New checkout"}' > /dev/null

          curl -sf -X POST $BASE/api/v1/projects/checkout/environments/production/segments \
            -H "$AUTH" -H 'content-type: application/json' \
            -d '{"key":"beta-testers","name":"Beta testers"}' > /dev/null
          curl -sf -X PUT $BASE/api/v1/projects/checkout/environments/production/segments/beta-testers \
            -H "$AUTH" -H 'content-type: application/json' -d '{
            "included": ["user-42", "user-7"],
            "rules": [{
              "id": "00000000-0000-0000-0000-000000000001",
              "conditions": [{"attribute": "plan", "operator": "in", "values": ["enterprise"]}],
              "rollout": {"percentage": 20000}
            }]
          }' > /dev/null

          SDK=$(curl -sf -X POST $BASE/api/v1/projects/checkout/environments/production/keys \
            -H "$AUTH" -H 'content-type: application/json' \
            -d '{"name":"backend","scope":"server"}' | jq -r .secret)

          curl -sf -X PUT $BASE/api/v1/projects/checkout/environments/production/flags/checkout.v2 \
            -H "$AUTH" -H 'content-type: application/json' -d '{
            "enabled": true, "off_variant": "off",
            "fallthrough": {"kind":"rollout","weights":[{"variant":"on","weight":20000},{"variant":"off","weight":80000}]},
            "rules": [
              {"id":"11111111-1111-1111-1111-111111111111","description":"The beta cohort, whoever is in it today","segments":{"any_of":["beta-testers"]},"distribution":{"kind":"fixed","variant":"on"}},
              {"id":"22222222-2222-2222-2222-222222222222","description":"Paid plans get it immediately","conditions":[{"attribute":"plan","operator":"in","values":["pro","enterprise"]}],"distribution":{"kind":"fixed","variant":"on"}}
            ]
          }' > /dev/null

          # The README's own claim: user-42 is in the cohort, with no plan at
          # all, and is served by the segment rule.
          value=$(curl -sf -X POST $BASE/api/v1/evaluate/checkout.v2 \
            -H "authorization: Bearer $SDK" -H 'content-type: application/json' \
            -d '{"context":{"key":"user-42"}}' | jq -r .value)
          [ "$value" = true ] \
            || { echo "::error::the tour's segment rule did not serve user-42 ($value)"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose logs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flagforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image against a real database
        run: |
          docker network create flagforge-ci
          docker run -d --name pg --network flagforge-ci \
            -e POSTGRES_USER=flagforge -e POSTGRES_PASSWORD=flagforge -e POSTGRES_DB=flagforge \
            postgres:18-alpine
          until docker exec pg pg_isready -U flagforge; do sleep 1; done

          docker run -d --name api --network flagforge-ci -p 8080:8080 \
            -e DATABASE_URL=postgres://flagforge:flagforge@pg:5432/flagforge \
            -e JWT_SECRET=ci-secret-that-is-at-least-32-characters \
            flagforge:ci

          # The image runs its own migrations on boot; if that fails, so does
          # this.
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready; then
              ready=true; break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "the container never became ready"
            docker logs api
            exit 1
          fi

          # The dashboard is embedded in the same binary; if the Trunk stage
          # silently produced nothing, this is where it shows up.
          echo
          curl -sf http://localhost:8080/ | grep -q "FlagForge" \
            || { echo "the dashboard was not served"; docker logs api; exit 1; }
          echo "dashboard served"

          # A deep link must return the SPA shell, and a bad API path must not.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/projects/x)" = 200
          curl -s http://localhost:8080/api/v1/nope | grep -q '"type":"not_found"'
          echo "routing behaves"

